# Camera Exposure Configuration

[exposure]
# Time-based exposure settings
# Format: array of objects with hour, minute, and exposure time in microseconds
# The program will use the most recent time setting for the current time
time_exposures = [
    # Early morning (before sunrise)
    { hour = 0, minute = 0, exposure = 5000000 },   # 12:00 AM - high exposure
    { hour = 4, minute = 0, exposure = 4000000 },   # 4:00 AM - still high exposure
    
    # Morning transition (sunrise)
    { hour = 6, minute = 0, exposure = 3000000 },   # 6:00 AM - medium exposure
    { hour = 7, minute = 0, exposure = 2000000 },   # 7:00 AM - lower as light increases
    { hour = 8, minute = 0, exposure = 500000 },    # 8:00 AM - low exposure
    
    # Daytime
    { hour = 10, minute = 0, exposure = 200000 },   # 10:00 AM - bright daylight 
    { hour = 12, minute = 0, exposure = 100000 },   # 12:00 PM - minimum exposure (brightest)
    { hour = 15, minute = 0, exposure = 200000 },   # 3:00 PM - slightly higher
    
    # Evening transition (sunset)
    { hour = 17, minute = 0, exposure = 500000 },   # 5:00 PM - medium exposure
    { hour = 18, minute = 0, exposure = 1000000 },  # 6:00 PM - higher as light decreases
    { hour = 19, minute = 30, exposure = 3000000 }, # 7:30 PM - high exposure
    
    # Night
    { hour = 21, minute = 0, exposure = 5000000 }   # 9:00 PM - maximum exposure
]

# Day/night boundaries for LED control
# This determines when to use LED if night_led_only is enabled
[exposure.day]
start_hour = 6   # 6 AM
end_hour = 19    # 7 PM

# Auto-exposure tuning. Only the keys present here override the controller defaults.
[exposure.auto_exposure]
target_brightness = 110  # desired frame mean (0-255)
tolerance = 20

# Exposure bounds, microseconds. The floor is the sensor's, not a guess: the trace CSVs
# show frames delivered at 3023 μs, while a 5000 μs floor left hours 10-11 pinned at the
# limit, 25 points over target and 6.8% clipped. The ceiling is set by the 60s capture
# cadence rather than the sensor — every metering frame costs a full exposure, so a 10s
# ceiling can eat the interval during a hunt.
min_exposure = 3000
max_exposure = 1000000

# Analogue gain ceiling. Gain above this is converted into exposure time instead, so the
# frame gets its light from a longer integration rather than from amplified read noise.
# The subject is static, so long exposures cost nothing. At 8.0 the AGC bought the entire
# night with gain (5.4x median) and left exposure parked at the 66645 μs frame-duration
# ceiling. Raise it only if the scene starts moving or the hunt gets too slow.
max_analogue_gain = 2.0

# Highlight budget: max % of pixels allowed at/above 250. The LED is an on-axis point
# source, so at night the frame centre runs ~2.8x the mean and a mean on target can
# still mean a destroyed centre — the mean cannot detect this, so cap it directly.
# Measured on recorded data: 0.8% daylight (fine), 1.8% night (acceptable),
# 4.1-4.7% night (centre gone). Lower = safer highlights, darker surroundings.
# Keep this above the acceptable 1.8% reading: the LED's specular core stays clipped at
# any exposure, so a budget below what the scene can physically reach just darkens
# everything. The controller detects that floor and stops, but a sane budget avoids it.
max_clip_pct = 2.0